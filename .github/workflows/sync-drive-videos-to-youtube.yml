name: Sync Drive Videos to YouTube

on:
  schedule:
    # Every 6 hours. Runs on a full GitHub Actions runner (hours-long limit)
    # rather than a Vercel function, since video uploads can be slow/large.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: node scripts/sync-drive-videos-to-youtube.js
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_DRIVE_VIDEOS_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_VIDEOS_FOLDER_ID }}
          GOOGLE_VIDEOS_SHEET_ID: ${{ secrets.GOOGLE_VIDEOS_SHEET_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
